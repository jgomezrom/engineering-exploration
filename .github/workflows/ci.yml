name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # The tests are .mts files run by Node's built-in test runner, which
          # needs a Node version that strips TypeScript types natively.
          node-version: 24
          cache: npm
      - run: npm ci
      # PageProps/LayoutProps are generated into .next/types, which a fresh
      # checkout doesn't have, so tsc can't see them without this first.
      - name: Generate route types
        run: npx next typegen
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
